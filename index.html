<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video Component</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="preview">
            <span class="symbol">&#x21bb;</span>
        </div>
        <div class="info">
            <div class="container">
                <div class="fill">
                    <span>UPLOADING 40%</span>
                </div>
                <div class="remaining">
                    <span>About 23 minutes remaining</span>
                </div>
            </div>
            <h3 class="title">Title of video</h3>
            <p class="note">* Your video is still uploading. Please keep this page open until it's done.</p>
        </div>
        <div class="action">
            <button type="button" class="done">DONE</button>
        </div>
    </div>
</body>

</html>
